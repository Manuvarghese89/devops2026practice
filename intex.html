<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px;
            text-align: center;
        }
        section {
            padding: 20px;
        }
        button {
            background-color: #ff9900;
            border: none;
            padding: 10px 15px;
            color: black;
            cursor: pointer;
            border-radius: 5px;
        }
        footer {
            background-color: #232f3e;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Page</h1>
    <p>Simple HTML Example</p>
</header>

<section>
    <h2>About</h2>
    <p>This is a basic HTML page. You can edit this text.</p>

    <button onclick="showMessage()">Click Me</button>
</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

<script>
    function showMessage() {
        alert("Button clicked successfully!");
    }
</script>

</body>
</html>
